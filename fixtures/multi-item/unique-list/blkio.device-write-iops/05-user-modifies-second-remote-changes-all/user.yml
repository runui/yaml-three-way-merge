services:
    app:
        blkio_config:
            device_write_iops: !reset []
---
services:
    app:
        blkio_config:
            device_write_iops:
                - path: /dev/a
                  rate: "100"
                - path: /dev/b
                  rate: "12100"
                - path: /dev/c
                  rate: "21100"
