services:
    app:
        deploy:
            resources:
                limits:
                    devices:
                        - capabilities:
                            - gpu
                          driver: nvidia
        image: busybox:latest
    sidecar:
        deploy:
            resources:
                limits:
                    devices:
                        - capabilities:
                            - gpu
                          device_ids:
                            - GPU-remote-b
                          driver: nvidia
        image: busybox:latest
