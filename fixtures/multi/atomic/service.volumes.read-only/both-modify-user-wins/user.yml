services:
    app:
        volumes: !reset []
---
services:
    app:
        volumes:
            - read_only: true
              source: /host
              target: /container
              type: bind
---
services:
    sidecar:
        volumes: !reset []
---
services:
    sidecar:
        volumes:
            - read_only: true
              source: /host
              target: /container
              type: bind
