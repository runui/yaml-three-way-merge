services:
    app:
        blkio_config:
            device_read_bps:
                - path: /dev/a
                  rate: 1mb
        image: busybox:latest
    sidecar:
        blkio_config:
            device_read_bps:
                - path: /dev/b
                  rate: 131mb
        image: busybox:latest
