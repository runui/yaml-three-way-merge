services:
    app:
        blkio_config:
            device_read_iops: !reset []
---
services:
    app:
        blkio_config:
            device_read_iops:
                - path: /dev/a
                  rate: "2100"
                - path: /dev/b
                  rate: "11100"
                - path: /dev/c
                  rate: "22100"
