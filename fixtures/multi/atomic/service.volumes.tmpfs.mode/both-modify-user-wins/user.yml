services:
    app:
        volumes: !reset []
---
services:
    app:
        volumes:
            - source: /host
              target: /container
              tmpfs:
                mode: 2
              type: bind
---
services:
    sidecar:
        volumes: !reset []
---
services:
    sidecar:
        volumes:
            - source: /host
              target: /container
              tmpfs:
                mode: 2
              type: bind
