services:
    app:
        deploy:
            resources:
                reservations:
                    devices: !reset []
---
services:
    app:
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities:
                            - gpu
                          driver: nvidia
                          options:
                            a: device-option-a-user
                            b: device-option-b-base
                            b-c: device-option-b-user
