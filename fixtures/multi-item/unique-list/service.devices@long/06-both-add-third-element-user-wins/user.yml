services:
    app:
        devices: !reset []
---
services:
    app:
        devices:
            - permissions: rwm
              source: /dev/base-a
              target: /dev/a
            - permissions: rwm
              source: /dev/base-b
              target: /dev/b
            - permissions: rwm
              source: /dev/user-c
              target: /dev/c
