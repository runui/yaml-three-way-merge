services:
    app:
        blkio_config:
            device_read_iops:
                - path: /dev/a
                  rate: "100"
        image: busybox:latest
    sidecar:
        blkio_config:
            device_read_iops:
                - path: /dev/b
                  rate: "11100"
        image: busybox:latest
