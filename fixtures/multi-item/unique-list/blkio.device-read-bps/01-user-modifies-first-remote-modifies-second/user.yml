services:
    app:
        blkio_config:
            device_read_bps: !reset []
---
services:
    app:
        blkio_config:
            device_read_bps:
                - path: /dev/a
                  rate: 21mb
                - path: /dev/b
                  rate: 111mb
                - path: /dev/c
                  rate: 211mb
