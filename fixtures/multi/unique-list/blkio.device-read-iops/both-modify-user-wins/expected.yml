services:
    app:
        blkio_config:
            device_read_iops:
                - path: /dev/a
                  rate: "2100"
        image: busybox:latest
    sidecar:
        blkio_config:
            device_read_iops:
                - path: /dev/b
                  rate: "12100"
        image: busybox:latest
