services:
    app:
        blkio_config:
            device_read_iops: !reset []
---
services:
    app:
        blkio_config:
            device_read_iops:
                - path: /dev/a
                  rate: "2100"
---
services:
    sidecar:
        blkio_config:
            device_read_iops: !reset []
---
services:
    sidecar:
        blkio_config:
            device_read_iops:
                - path: /dev/b
                  rate: "12100"
