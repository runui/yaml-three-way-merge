services:
    app:
        deploy:
            resources:
                limits:
                    devices:
                        - capabilities:
                            - tpu-a
                          driver: nvidia
        image: busybox:latest
    sidecar:
        deploy:
            resources:
                limits:
                    devices:
                        - capabilities:
                            - tpu-b
                          driver: nvidia
        image: busybox:latest
