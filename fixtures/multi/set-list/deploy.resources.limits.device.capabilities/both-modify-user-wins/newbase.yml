services:
    app:
        deploy:
            resources:
                limits:
                    devices:
                        - capabilities:
                            - npu-a
                          driver: nvidia
        image: busybox:latest
    sidecar:
        deploy:
            resources:
                limits:
                    devices:
                        - capabilities:
                            - npu-b
                          driver: nvidia
        image: busybox:latest
