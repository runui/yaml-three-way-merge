services:
    app:
        volumes: !reset []
---
services:
    app:
        volumes:
            - source: /host
              target: /container
              type: bind
              volume:
                nocopy: true
---
services:
    sidecar:
        volumes: !reset []
---
services:
    sidecar:
        volumes:
            - source: /host
              target: /container
              type: bind
              volume:
                nocopy: true
