services:
    app:
        build:
            secrets:
                - gid: base-value
                  source: base
                  target: /run/secrets/base
        image: busybox:latest
    sidecar:
        build:
            secrets:
                - gid: remote-value
                  source: base
                  target: /run/secrets/base
        image: busybox:latest
