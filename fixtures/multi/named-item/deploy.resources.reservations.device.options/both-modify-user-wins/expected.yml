services:
    app:
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities:
                            - gpu
                          driver: nvidia
                          options:
                            a: device-option-a-user
        image: busybox:latest
    sidecar:
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities:
                            - gpu
                          driver: nvidia
                          options:
                            b: device-option-b-user
        image: busybox:latest
