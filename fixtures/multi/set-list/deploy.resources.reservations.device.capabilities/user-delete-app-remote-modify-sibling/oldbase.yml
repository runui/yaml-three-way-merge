services:
    app:
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities:
                            - gpu-a
                          driver: nvidia
        image: busybox:latest
    sidecar:
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities:
                            - gpu-b
                          driver: nvidia
        image: busybox:latest
