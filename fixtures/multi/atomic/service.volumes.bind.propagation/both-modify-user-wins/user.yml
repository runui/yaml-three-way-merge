services:
    app:
        volumes: !reset []
---
services:
    app:
        volumes:
            - bind:
                propagation: user-value
              source: /host
              target: /container
              type: bind
---
services:
    sidecar:
        volumes: !reset []
---
services:
    sidecar:
        volumes:
            - bind:
                propagation: user-value
              source: /host
              target: /container
              type: bind
