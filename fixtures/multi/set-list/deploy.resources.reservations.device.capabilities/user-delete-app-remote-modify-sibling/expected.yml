services:
    app:
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities: []
                          driver: nvidia
        image: busybox:latest
    sidecar:
        deploy:
            resources:
                reservations:
                    devices:
                        - capabilities:
                            - npu-b
                          driver: nvidia
        image: busybox:latest
